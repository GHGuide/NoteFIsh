services:
  - type: web
    name: notefish
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: notefish-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: NOTEFISH_PUBLIC_DEMO
        value: "true"
      - key: NOTEFISH_DESK_PASSWORD
        sync: false
      - key: FISH_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FISH_MODEL
        value: s2.1-pro-free
      # Seats survive a restart only with a secret. numInstances stays 1: the
      # floor and the JSON store live in one process.
      - key: NOTEFISH_SESSION_SECRET
        generateValue: true
      - key: NOTEFISH_MAX_AGENTS
        value: "20"
      - key: NOTEFISH_MAX_CONCURRENT_CALLS
        value: "20"
      # Outbound delivery. Leave unset to keep calls inside NoteFIsh.
      - key: NOTEFISH_WEBHOOK_URL
        sync: false
      - key: NOTEFISH_WEBHOOK_SECRET
        sync: false
      - key: NOTEFISH_EXPORT_TOKEN
        sync: false
