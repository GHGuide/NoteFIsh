services:
  - type: web
    name: notefish
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: notefish-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      # Accounts run this desk: the first person to sign up is its admin, and
      # everyone after that arrives by invitation. Set NOTEFISH_PUBLIC_DEMO=true
      # only for a throwaway demo with no accounts and no real calls.
      - key: NOTEFISH_PUBLIC_DEMO
        value: "false"
      # Who may create the first account, and so become this desk's admin. Set it
      # before the service is reachable; everyone else arrives by invitation.
      - key: NOTEFISH_ADMIN_EMAIL
        sync: false
      # The built Mac app the download page hands out, and the version it names.
      - key: NOTEFISH_MAC_BUILD_URL
        sync: false
      - key: NOTEFISH_MAC_BUILD_VERSION
        sync: false
      # Hosts that should see the marketing page instead of the desk sign-in.
      - key: NOTEFISH_SITE_HOSTS
        sync: false
      # The address people reach this desk on, e.g. https://desk.yourcompany.com.
      # Invitation links and the sign-in cookie are built from it.
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional: a shared password as a second way in, alongside accounts.
      - key: NOTEFISH_DESK_PASSWORD
        sync: false
      - key: FISH_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional second voice provider: speech falls back here when Fish cannot speak.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FISH_MODEL
        value: s2.1-pro-free
      # Seats survive a restart only with a secret. numInstances stays 1: the
      # floor and the JSON store live in one process.
      - key: NOTEFISH_SESSION_SECRET
        generateValue: true
      - key: NOTEFISH_MAX_AGENTS
        value: "20"
      - key: NOTEFISH_MAX_CONCURRENT_CALLS
        value: "20"
      # Outbound delivery. Leave unset to keep calls inside NoteFish.
      - key: NOTEFISH_WEBHOOK_URL
        sync: false
      - key: NOTEFISH_WEBHOOK_SECRET
        sync: false
      - key: NOTEFISH_EXPORT_TOKEN
        sync: false
