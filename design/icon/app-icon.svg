<!-- NoteFish app icon: the fish on an ink tile, drawn on the macOS icon grid
     (an 824px rounded square centred in a 1024px canvas). Render to PNG, then
     `npx tauri icon design/icon/app-icon.png` writes every size into src-tauri/icons. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2B28"/><stop offset="1" stop-color="#191817"/></linearGradient>
    <radialGradient id="sheen" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".12"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".32"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g transform="translate(198.5 175.4) scale(6.6)" filter="url(#soft)">
    <g fill="#F3F1EC"><circle cx="67" cy="51" r="14"/><circle cx="59.7" cy="67.3" r="14"/><circle cx="42" cy="74" r="14"/><circle cx="24.3" cy="67.3" r="14"/><circle cx="17" cy="51" r="14"/><circle cx="24.3" cy="34.7" r="14"/><circle cx="42" cy="28" r="14"/><circle cx="59.7" cy="34.7" r="14"/><circle cx="80" cy="36" r="12"/><circle cx="80" cy="66" r="12"/><circle cx="71" cy="51" r="11"/><ellipse cx="42" cy="51" rx="30" ry="26"/></g>
    <g transform="rotate(-9 34 47)"><rect x="31.4" y="40" width="5.2" height="14" rx="2.6" fill="#1E1D1B"/></g>
    <g transform="rotate(9 50 47)"><rect x="47.4" y="40" width="5.2" height="14" rx="2.6" fill="#1E1D1B"/></g>
  </g>
</svg>
